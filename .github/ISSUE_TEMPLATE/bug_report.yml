name: Bug report
description: Report a reproducible problem with superPi
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, session files, private paths, or untrusted tool output.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0-rc.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic paths and values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and safe logs
      description: Include Linux distribution, Node version, command, and redacted output only.
    validations:
      required: true
